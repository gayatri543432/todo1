
<div class="row">
    <div class="col-md-6">
        <app-todo-form
        (newTodo)="onSubmitTodo($event)"
        [edittodo]="editTodo"
        (updateTodo)="onUpdateTodo($event)"
        ></app-todo-form>
    </div>
    <div class="col-md-6">
        <app-todo-list
        [todosArr]="todoArr"
        (editTodo)="onEditTodo($event)"
        (removeTodo)="onRemoveTodo($event)"
        ></app-todo-list>
    </div>
</div>

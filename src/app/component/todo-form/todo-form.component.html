
<div class="card">
    <div class="card-body"  class="todo-form">
        <h2 class="text-center">{{isInEditMode?'Update Todo':'Add Todo'}}</h2>
        <form #todoForm="ngForm" (ngSubmit)="onSubmit()" >
            <label for="title">Title*</label>
            <input type="text"
            required
            ngModel
            name="title"
            class="form-control"
            >
            <label for="completed">Status*</label>
            <select name="completed" class="form-control mb-3" required ngModel >
                <option [ngValue]="true">Completed</option>
                <option [ngValue]="false">Pending</option>

            </select>

            <button
            *ngIf="!isInEditMode"
            mat-raised-button color="primary" class="btn-block">Add Todo</button>
            <div class="d-flex justify-content-center">
                <button
            (click)="onUpdate()"
            *ngIf="isInEditMode"
            class="btn-block"
            mat-raised-button color="accent">Update Todo</button>

            
        </form>
    </div>
</div>

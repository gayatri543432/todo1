
<ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let todo of todosArr">
        <strong  class="todo-title">{{todo.title}}</strong>
        <div class="todo-status">
            <span class="badge"
            [ngClass]="{
               'badge-primary':todo.completed,
                'badge-warning':!todo.completed

            }"
            >{{todo.completed?'Completed':'Pending'}}</span>
        </div>
        <div>
            <button
            (click)="onEdit(todo)"
            mat-raised-button color="primary" class="mr-3">Edit</button>
            <button
            (click)="onRemove(todo.id)"
            mat-raised-button color="warn">Remove</button>
        </div>
    </li>
</ul>
